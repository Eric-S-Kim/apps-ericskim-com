<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Eric's Apps</title>
<meta name="theme-color" content="#002F10">
<meta name="description" content="Eric's personal app store">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="icon-any-192.png">
<link rel="apple-touch-icon" sizes="192x192" href="icon-any-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lustria&family=Hanken+Grotesk:wght@400;500;600;700&display=swap">
<style>
  :root {
    /* Flourishing Ray brand tokens */
    --green: #002F10;            /* deep forest — headings / ink-on-light */
    --green-700: #006823;        /* primary brand green */
    --green-500: #009B34;        /* emerald — vitality */
    --lime: #D8FC7B;             /* lime accent (use sparingly) */
    --camel: #B59764;            /* earthy warmth (decorative only — too light for text) */
    --camel-deep: #7E5F28;       /* darkened camel for text — 5.4:1 on beige (WCAG AA) */
    --gold: #E9A73C;            /* sunlight, shared with the launcher artwork */
    --horizon-glow: #EAB772;     /* sunset floor — see brand/sunset-enveloped.css */
    --warm-ink: #6B4E1E;
    --cream: #E9E2D1;
    --ink: #131313;
    --beige: #f7f4ee;
    --green-soft: rgba(0, 47, 16, 0.08);
    --green-line: rgba(0, 47, 16, 0.18);
    --serif: 'Lustria', Georgia, 'Times New Roman', serif;
    --sans: 'TT Commons', 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
  html, body {
    margin: 0;
    padding: 0;
    color: var(--green);
    font-family: var(--sans);
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
    min-height: 100dvh;
  }
  body {
    position: relative;
    isolation: isolate;
    background: linear-gradient(180deg, #FDFBF6 0%, #FBF3E7 50%, #F7E7CF 100%) fixed;
    display: flex;
    flex-direction: column;
    padding: max(env(safe-area-inset-top), 34px) max(env(safe-area-inset-right), 20px) max(env(safe-area-inset-bottom), 40px) max(env(safe-area-inset-left), 20px);
  }
  body::before, body::after {
    content: '';
    position: fixed;
    pointer-events: none;
    z-index: -1;
  }
  /* "Enveloped" sunglow: one wide bloom rising off the floor plus a soft column of
     light up each side edge, so the screen sits inside the light rather than above a
     horizon. Full-viewport and fixed, so it never scrolls with the tiles. */
  body::before {
    top: 0;
    bottom: 0;
    left: 0;
    right: 0;
    background:
      radial-gradient(ellipse 430px 290px at 50% 107%, color-mix(in srgb, var(--gold) 34%, transparent), transparent 66%),
      radial-gradient(ellipse 190px 760px at -8% 68%, color-mix(in srgb, var(--gold) 15%, transparent), transparent 70%),
      radial-gradient(ellipse 190px 760px at 108% 68%, color-mix(in srgb, var(--gold) 15%, transparent), transparent 70%);
  }
  body::after {
    bottom: 0;
    left: 0;
    right: 0;
    height: 160px;
    background: linear-gradient(180deg,
      color-mix(in srgb, var(--horizon-glow) 0%, transparent),
      color-mix(in srgb, var(--horizon-glow) 46%, transparent));
  }
  .day-arc, header, .grid {
    width: 100%;
    max-width: 640px;
    margin-left: auto;
    margin-right: auto;
  }
  .day-arc { height: 76px; flex: none; padding-top: 8px; }
  .day-arc svg { display: block; width: 100%; height: 48px; overflow: visible; }
  .day-curve { fill: none; stroke: rgba(126,95,40,.2); stroke-width: 1.5; stroke-linecap: round; }
  .day-sun { fill: var(--gold); }
  .day-halo { fill: var(--gold); opacity: .2; }
  .day-labels {
    display: flex;
    justify-content: space-between;
    font-size: 10.5px;
    line-height: 20px;
    font-weight: 500;
    color: rgba(126,95,40,.6);
    white-space: nowrap;
  }
  header {
    text-align: left;
    margin-top: 0;
    margin-bottom: 22px;
    flex: none;
  }
  h1 {
    margin: 0;
    font-family: var(--serif);
    font-size: 40px;
    font-weight: 400;
    letter-spacing: -0.01em;
    line-height: 1.08;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 11px;
    margin: 0 auto;
    width: 100%;
    flex: none;
  }
  .card {
    position: relative;
    height: 128px;
    min-width: 0;
    border-radius: 20px;
    background: rgba(255,255,255,.69);
    border: 1px solid rgba(255,255,255,.8);
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 10px;
    padding: 13px 14px;
    text-align: left;
    overflow: hidden;
    touch-action: manipulation;
  }
  .card .label {
    margin-top: auto;
    font-size: 15px;
    font-weight: 600;
    line-height: 1.2;
    max-width: 100%;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .card-app {
    position: relative;
    opacity: 1;
    cursor: pointer;
    text-decoration: none;
    color: inherit;
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }
  .card-app:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 18px rgba(0, 47, 16, 0.12);
  }
  .card-app > img, .card-app .mono, .card-app .label { position: relative; z-index: 1; }
  .card-app .remove { z-index: 2; }
  .card-app:active {
    transform: translateY(0);
  }
  /* Reorder: tiles never select text or pop the link menu on a long press. */
  .card-app { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  /* Pressed-and-holding cue before the lift (touch only). */
  .card-app.pressing { scale: .96; transition: scale .35s cubic-bezier(.2,0,0,1); }
  /* Siblings slide into their new slot (FLIP: translate is set to the old
     offset, then released under this transition). */
  .card-app.settle { transition: translate .22s cubic-bezier(.2,0,0,1); }
  /* The tile being moved stays in the grid as an empty slot; a floating clone
     follows the finger. */
  .card-app.gap { opacity: 0; }
  .card-app.gap .remove { display: none; }
  .card-app.lifted {
    position: fixed;
    margin: 0;
    z-index: 1000;
    pointer-events: none;
    transform: none;
    scale: 1.06;
    background: #fffdfa;
    box-shadow: 0 14px 34px rgba(0, 47, 16, .28), 0 2px 6px rgba(0, 47, 16, .12);
    transition: scale .18s cubic-bezier(.2,0,0,1), box-shadow .18s ease;
  }
  .card-app.lifted .remove { display: none; }
  .card-app.lifted.landing { transition: translate .2s cubic-bezier(.2,0,0,1), scale .2s cubic-bezier(.2,0,0,1), box-shadow .2s ease; scale: 1; box-shadow: 0 0 0 rgba(0,0,0,0); }
  .card-app > img { width: 64px; height: 64px; object-fit: contain; flex: none; }
  .card:focus-visible { outline: 2px solid var(--green-700); outline-offset: 3px; }
  /* monogram fallback icon (used by private/link tiles with no image) */
  .mono {
    width: 64px;
    height: 64px;
    flex: none;
    border-radius: 18px;
    background: var(--green);
    color: var(--beige);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 30px;
    font-weight: 600;
  }
  /* Keep Add available below a full grid without creating a fifth full row. */
  .card-add {
    opacity: 1;
    cursor: pointer;
    color: var(--green);
    text-decoration: none;
    transition: transform 0.15s ease, background 0.15s ease;
    border: 1px dashed var(--green-line);
  }
  .card-add:hover { transform: translateY(-2px); background: var(--green-soft); }
  .card-add .plus { width: 64px; height: 64px; font-size: 38px; font-weight: 300; line-height: 64px; opacity: 0.7; }
  .card-add:nth-child(odd):not(:first-child) {
    grid-column: 1 / -1;
    height: 44px;
    flex-direction: row;
    align-items: center;
    justify-content: center;
    padding: 7px 14px;
  }
  .card-add:nth-child(odd):not(:first-child) .plus { width: auto; height: auto; font-size: 24px; line-height: 1; }
  /* remove (×) control on private tiles */
  .remove {
    position: absolute;
    top: 8px;
    right: 8px;
    width: 26px;
    height: 26px;
    border-radius: 50%;
    background: var(--green-soft);
    color: var(--green);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 17px;
    line-height: 1;
    cursor: pointer;
    opacity: 0;
    transition: opacity 0.15s ease;
  }
  .card-app:hover .remove, .remove:focus { opacity: 1; }
  @media (pointer: coarse) { .remove { opacity: 0.55; } }
  /* add-app form panel */
  .add-panel {
    width: 100%;
    max-width: 480px;
    margin: 0 auto 24px;
    padding: 16px 18px;
    background: rgba(255,255,255,.69);
    border: 1px solid rgba(255,255,255,.8);
    border-radius: 16px;
    flex-direction: column;
    gap: 10px;
    display: none;
  }
  .add-panel.open { display: flex; }
  .add-panel label { font-size: 12px; font-weight: 600; opacity: 0.8; display: block; margin-bottom: 4px; }
  .add-panel input {
    width: 100%;
    padding: 10px 12px;
    border-radius: 10px;
    border: 1.5px solid var(--green-line);
    background: var(--beige);
    color: var(--green);
    font: inherit;
    font-size: 14px;
  }
  .add-panel .row { display: flex; gap: 10px; margin-top: 4px; }
  .add-panel button {
    padding: 10px 16px;
    border-radius: 10px;
    border: none;
    font: inherit;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
  }
  .add-panel .primary { background: var(--green); color: var(--beige); }
  .add-panel .ghost { background: transparent; color: var(--green); border: 1.5px solid var(--green-line); }
  .add-err { color: #b3261e; font-size: 12px; min-height: 14px; margin: 0; }
  .add-note { font-size: 12px; opacity: 0.7; line-height: 1.4; margin: 4px 0 0; }
  @media (prefers-reduced-motion: reduce) {
    .card, .remove, .day-sun, .day-halo { transition: none; }
  }
</style>
</head>
<body>
  <div class="day-arc" aria-label="Local time of day">
    <svg viewBox="0 0 372 48" width="372" height="48" aria-hidden="true">
      <path class="day-curve" d="M2,46 Q186,-14 370,46"/>
      <circle class="day-halo" id="dayHalo" cx="2" cy="46" r="17"/>
      <circle class="day-sun" id="daySun" cx="2" cy="46" r="7"/>
    </svg>
    <div class="day-labels"><span>8 AM</span><span>11 PM</span></div>
  </div>
  <header>
    <!-- Header mark intentionally omitted from this layout. -->
    <h1>Eric's Apps</h1>
  </header>

  <!-- Add-app form. Private apps entered here are saved ONLY in this device's
       localStorage — never sent anywhere, never committed to this public repo. -->
  <form class="add-panel" id="addPanel" autocomplete="off" novalidate>
    <div>
      <label for="appName">App name</label>
      <input id="appName" type="text" placeholder="Morning Brief" maxlength="40">
    </div>
    <div>
      <label for="appUrl">App URL</label>
      <input id="appUrl" type="url" inputmode="url" placeholder="https://my-app.up.railway.app/">
    </div>
    <div>
      <label for="appIcon">Icon URL (optional)</label>
      <input id="appIcon" type="url" inputmode="url" placeholder="https://my-app/icon.png">
    </div>
    <p class="add-err" id="addErr" role="alert"></p>
    <div class="row">
      <button type="submit" class="primary">Add to this device</button>
      <button type="button" class="ghost" id="addCancel">Cancel</button>
    </div>
    <p class="add-note">Saved only on this device. Private app links stay on your phone — they're never published or sent anywhere.</p>
  </form>

  <div class="grid" id="apps">
    <noscript>
      <p>Turn on JavaScript to view the apps saved on this device.</p>
    </noscript>
  </div>

  <script>
    // Local clock only; recompute after backgrounding because timers may be throttled.
    (function () {
      var START = 8 * 60, END = 23 * 60;
      var sun = document.getElementById('daySun');
      var halo = document.getElementById('dayHalo');
      function updateDayArc() {
        var now = new Date();
        var mins = now.getHours() * 60 + now.getMinutes();
        var t = Math.min(1, Math.max(0, (mins - START) / (END - START)));
        var x = 2 + 368 * t;
        var y = 46 - 120 * t + 120 * t * t;
        [sun, halo].forEach(function (dot) {
          dot.setAttribute('cx', x);
          dot.setAttribute('cy', y);
        });
      }
      updateDayArc();
      setInterval(updateDayArc, 60000);
      document.addEventListener('visibilitychange', function () {
        if (!document.hidden) updateDayArc();
      });
    })();

    // Eric's Apps launcher.
    //  - PUBLIC apps come from apps.json (committed; ship registers them).
    //  - PRIVATE apps are added on-device via the "+ Add app" tile and live ONLY in this
    //    device's localStorage. Their URLs are never committed to this public repo and
    //    never sent anywhere, so a stranger loading this public page sees only public apps.
    //  - Tiles are DOM-built (never innerHTML) and every href/src is scheme-checked
    //    (http/https only) on BOTH input and render, so no entry can inject markup or a
    //    javascript:/data: link.
    (function () {
      var grid = document.getElementById('apps');
      var panel = document.getElementById('addPanel');
      var PKEY = 'eric-apps-private-v1';
      var OKEY = 'eric-apps-order-v1';
      var publicApps = [];
      var pickup = null;
      var dragState = null;
      var suppressClick = false;

      function safeUrl(u) {
        if (typeof u !== 'string' || !u) return null;
        try {
          var p = new URL(u, location.href);
          return (p.protocol === 'https:' || p.protocol === 'http:') ? p.href : null;
        } catch (_) { return null; }
      }
      function isCrossOrigin(href) {
        try { return new URL(href, location.href).origin !== location.origin; } catch (_) { return false; }
      }
      // Theme color guard: accept only a literal hex color (3/4/6/8 digits, the last
      // form carrying alpha for the glow). Anything else is dropped, so a crafted setup
      // link can never inject CSS — worst case a tile just keeps its default colors.
      function safeColor(c) {
        return (typeof c === 'string' && /^#([0-9a-fA-F]{3,4}|[0-9a-fA-F]{6}|[0-9a-fA-F]{8})$/.test(c)) ? c : null;
      }
      // Icon src guard: allow http(s), a relative path, or a base64 raster data: URI
      // (an <img> never executes script, and svg/text data URIs are rejected).
      function safeIconSrc(s) {
        if (typeof s !== 'string' || !s) return null;
        if (/^data:image\/(png|jpe?g|gif|webp);base64,[a-z0-9+/=]+$/i.test(s)) return s;
        var u = safeUrl(s);
        if (u) return u;
        if (!/^[a-z][a-z0-9+.-]*:/i.test(s)) return s; // relative path (e.g. public app icon)
        return null;
      }
      function b64urlDecode(s) {
        s = String(s).replace(/-/g, '+').replace(/_/g, '/');
        var pad = s.length % 4; if (pad) s += '===='.slice(pad);
        var bin = atob(s);
        try {
          return decodeURIComponent(bin.split('').map(function (ch) {
            return '%' + ('00' + ch.charCodeAt(0).toString(16)).slice(-2);
          }).join(''));
        } catch (_) { return bin; }
      }
      function loadPrivate() {
        try { var v = JSON.parse(localStorage.getItem(PKEY)); return Array.isArray(v) ? v : []; }
        catch (_) { return []; }
      }
      function savePrivate(arr) {
        try { localStorage.setItem(PKEY, JSON.stringify(arr)); return true; } catch (_) { return false; }
      }
      function loadOrder() {
        try {
          var v = JSON.parse(localStorage.getItem(OKEY));
          return Array.isArray(v) && v.every(function (x) { return typeof x === 'string'; }) ? v.slice(0, 200) : [];
        } catch (_) { return []; }
      }
      function saveOrder(arr) {
        if (!Array.isArray(arr) || !arr.every(function (x) { return typeof x === 'string'; })) return false;
        try { localStorage.setItem(OKEY, JSON.stringify(arr.slice(0, 200))); return true; } catch (_) { return false; }
      }
      function tileKey(app, isPrivate) {
        return (isPrivate ? 'priv:' + (app.id || app.url) : 'pub:' + (app.slug || app.url));
      }
      function genId() {
        try { return crypto.randomUUID(); }
        catch (_) { return 'p-' + Date.now() + '-' + Math.round(Math.random() * 1e6); }
      }
      function monogram(name) {
        var d = document.createElement('div');
        d.className = 'mono';
        d.textContent = (String(name || '?').trim().charAt(0) || '?').toUpperCase();
        return d;
      }

      function makeTile(app, isPrivate, key) {
        var url = safeUrl(app.url);
        var a = document.createElement('a');
        a.className = 'card card-app';
        a.href = url || '#';
        a.dataset.key = key;
        a.setAttribute('aria-label', app.name || app.slug || 'app');
        var external = isPrivate || app.kind === 'link' || (url && isCrossOrigin(url));
        if (external) { a.target = '_blank'; a.rel = 'noopener noreferrer'; }

        var iconStr = safeIconSrc(app.icon);
        if (iconStr) {
          var img = document.createElement('img');
          img.src = iconStr; img.alt = ''; img.width = 46; img.height = 46;
          img.onerror = function () { this.replaceWith(monogram(app.name)); };
          a.appendChild(img);
        } else {
          a.appendChild(monogram(app.name));
        }

        var label = document.createElement('div');
        label.className = 'label';
        label.textContent = app.name || app.slug || '';
        a.appendChild(label);

        // Sunlight shares one glass surface; stored tile themes stay untouched.

        if (isPrivate) {
          var rm = document.createElement('span');
          rm.className = 'remove';
          rm.setAttribute('role', 'button');
          rm.setAttribute('tabindex', '0');
          rm.setAttribute('aria-label', 'Remove ' + (app.name || 'app'));
          rm.textContent = '×';
          var doRemove = function (e) {
            e.preventDefault(); e.stopPropagation();
            if (app.rid) dismissRid(app.rid); // a registry tile removed here stays removed
            // remove by stable id when present; fall back to url+name for legacy entries
            var arr = loadPrivate().filter(function (x) {
              return app.id ? x.id !== app.id : !(x.url === app.url && x.name === app.name);
            });
            savePrivate(arr); renderAll();
          };
          rm.addEventListener('click', doRemove);
          rm.addEventListener('keydown', function (e) { if (e.key === 'Enter' || e.key === ' ') doRemove(e); });
          a.appendChild(rm);
        }
        return a;
      }

      function addCard() {
        var a = document.createElement('a');
        a.className = 'card card-add';
        a.href = '#';
        a.setAttribute('role', 'button');
        a.setAttribute('aria-label', 'Add an app to this device');
        var plus = document.createElement('div'); plus.className = 'plus'; plus.textContent = '+';
        var label = document.createElement('div'); label.className = 'label'; label.textContent = 'Add an app';
        a.appendChild(plus); a.appendChild(label);
        a.addEventListener('click', function (e) { e.preventDefault(); openPanel(); });
        return a;
      }

      function renderAll() {
        grid.innerHTML = '';
        var items = [];
        publicApps.forEach(function (app) {
          items.push({ app: app, isPrivate: false, key: tileKey(app, false), index: items.length });
        });
        loadPrivate().forEach(function (app) {
          items.push({ app: app, isPrivate: true, key: tileKey(app, true), index: items.length });
        });
        var order = loadOrder();
        items.sort(function (a, b) {
          var ai = order.indexOf(a.key); var bi = order.indexOf(b.key);
          if (ai < 0 && bi < 0) return a.index - b.index;
          if (ai < 0) return 1;
          if (bi < 0) return -1;
          return ai - bi || a.index - b.index;
        });
        items.forEach(function (x) { grid.appendChild(makeTile(x.app, x.isPrivate, x.key)); });
        grid.appendChild(addCard());
      }

      // ---- Reorder by long-press (touch) or drag (mouse/pen) ----------------
      // The pressed tile stays in the grid as an invisible gap; a floating clone
      // follows the pointer via `translate` (compositor-only, batched per frame).
      // Slot rectangles are captured once at lift, so the target index comes
      // from pure geometry (the 11px gutter is a natural dead zone: no flicker).
      // Displaced siblings slide (FLIP), the clone glides into its slot on
      // release, and the page auto-scrolls when the pointer nears an edge.
      var HOLD_MS = 320;          // touch: press this long without moving to lift
      var SLOP_PX = 10;           // moving further than this during the hold = scroll, not lift
      var MOUSE_START_PX = 6;     // mouse/pen: lift after this much movement, no hold
      var EDGE_PX = 72;           // auto-scroll zone at the top/bottom of the viewport
      var EDGE_MAX_PX = 18;       // max auto-scroll per frame

      function cancelPickup() {
        if (!pickup) return;
        clearTimeout(pickup.timer);
        pickup.tile.classList.remove('pressing');
        pickup = null;
      }

      function tiles() {
        return Array.prototype.filter.call(grid.children, function (c) { return c.dataset && c.dataset.key; });
      }

      function measure(list) {
        var m = {};
        list.forEach(function (el) { var r = el.getBoundingClientRect(); m[el.dataset.key] = { x: r.left, y: r.top }; });
        return m;
      }

      // FLIP: after the DOM moved, offset each moved tile back to where it was and
      // let the `settle` transition carry it to its new slot.
      function animateShift(before, list) {
        list.forEach(function (el) {
          var was = before[el.dataset.key]; if (!was) return;
          var now = el.getBoundingClientRect();
          var dx = was.x - now.left, dy = was.y - now.top;
          if (!dx && !dy) return;
          el.classList.remove('settle');
          el.style.translate = dx + 'px ' + dy + 'px';
          void el.offsetWidth; // commit the offset before releasing it
          el.classList.add('settle');
          el.style.translate = '0px 0px';
          clearTimeout(el._settleTimer);
          el._settleTimer = setTimeout(function () { el.classList.remove('settle'); el.style.removeProperty('translate'); }, 260);
        });
      }

      function liftTile(tile, pointerId, clientX, clientY) {
        var rect = tile.getBoundingClientRect();
        var list = tiles();
        var slots = list.map(function (el) {
          var r = el.getBoundingClientRect();
          return { x: r.left + window.scrollX, y: r.top + window.scrollY, w: r.width, h: r.height };
        });
        var clone = tile.cloneNode(true);
        clone.classList.remove('pressing', 'gap', 'settle');
        clone.classList.add('lifted');
        clone.removeAttribute('href');
        clone.style.left = rect.left + 'px';
        clone.style.top = rect.top + 'px';
        clone.style.width = rect.width + 'px';
        clone.style.height = rect.height + 'px';
        document.body.appendChild(clone);
        tile.classList.remove('pressing');
        tile.classList.add('gap');
        try { navigator.vibrate(20); } catch (_) {}
        try { tile.setPointerCapture(pointerId); } catch (_) {}
        dragState = { tile: tile, clone: clone, pointerId: pointerId, slots: slots,
          index: list.indexOf(tile), originX: rect.left, originY: rect.top,
          grabDX: clientX - rect.left, grabDY: clientY - rect.top,
          x: clientX, y: clientY, raf: 0, scrollRaf: 0 };
        renderDrag();
      }

      function slotAt(pageX, pageY) {
        var s = dragState.slots;
        for (var i = 0; i < s.length; i++) {
          if (pageX >= s[i].x && pageX <= s[i].x + s[i].w && pageY >= s[i].y && pageY <= s[i].y + s[i].h) return i;
        }
        return -1;
      }

      function moveGap(to) {
        var list = tiles();
        var from = list.indexOf(dragState.tile);
        if (to === from || to < 0 || to >= list.length) return;
        var before = measure(list);
        var ref = list[to];
        if (to > from) grid.insertBefore(dragState.tile, ref.nextSibling); else grid.insertBefore(dragState.tile, ref);
        dragState.index = to;
        animateShift(before, list);
      }

      function renderDrag() {
        dragState.raf = 0;
        var d = dragState;
        d.clone.style.translate = (d.x - d.grabDX - d.originX) + 'px ' + (d.y - d.grabDY - d.originY) + 'px';
        var i = slotAt(d.x + window.scrollX, d.y + window.scrollY);
        if (i >= 0) moveGap(i);
      }

      function autoScroll() {
        var d = dragState;
        if (!d) return;
        var step = 0;
        var h = window.innerHeight;
        if (d.y < EDGE_PX) step = -EDGE_MAX_PX * (1 - d.y / EDGE_PX);
        else if (d.y > h - EDGE_PX) step = EDGE_MAX_PX * (1 - (h - d.y) / EDGE_PX);
        var max = document.documentElement.scrollHeight - h;
        if (step && ((step < 0 && window.scrollY > 0) || (step > 0 && window.scrollY < max))) {
          window.scrollBy(0, step);
          if (!d.raf) d.raf = requestAnimationFrame(renderDrag);
        }
        d.scrollRaf = requestAnimationFrame(autoScroll);
      }

      function finishDrag(e) {
        if (!dragState || e.pointerId !== dragState.pointerId) return;
        var d = dragState;
        dragState = null;
        if (d.raf) cancelAnimationFrame(d.raf);
        if (d.scrollRaf) cancelAnimationFrame(d.scrollRaf);
        var keys = tiles().map(function (el) { return el.dataset.key; });
        saveOrder(keys);
        // Glide the clone into the gap, then reveal the real tile.
        var target = d.tile.getBoundingClientRect();
        d.clone.classList.add('landing');
        d.clone.style.translate = (target.left - d.originX) + 'px ' + (target.top - d.originY) + 'px';
        var done = false;
        var land = function () {
          if (done) return; done = true;
          d.tile.classList.remove('gap');
          if (d.clone.parentNode) d.clone.parentNode.removeChild(d.clone);
        };
        d.clone.addEventListener('transitionend', land);
        setTimeout(land, 260);
        suppressClick = true;
        setTimeout(function () { suppressClick = false; }, 400);
      }

      grid.addEventListener('pointerdown', function (e) {
        var tile = e.target.closest('.card-app');
        if (!tile || e.target.closest('.remove') || dragState) return;
        if (e.pointerType === 'mouse' && e.button !== 0) return;
        cancelPickup();
        pickup = { tile: tile, pointerId: e.pointerId, pointerType: e.pointerType,
          x: e.clientX, y: e.clientY, pointerX: e.clientX, pointerY: e.clientY, timer: 0 };
        if (e.pointerType === 'touch') {
          tile.classList.add('pressing');
          pickup.timer = setTimeout(function () {
            var pending = pickup;
            pickup = null;
            if (!pending) return;
            liftTile(pending.tile, pending.pointerId, pending.pointerX, pending.pointerY);
          }, HOLD_MS);
        }
      });
      document.addEventListener('pointermove', function (e) {
        if (pickup && e.pointerId === pickup.pointerId) {
          pickup.pointerX = e.clientX; pickup.pointerY = e.clientY;
          var dx = e.clientX - pickup.x; var dy = e.clientY - pickup.y;
          var dist = dx * dx + dy * dy;
          if (pickup.pointerType === 'touch') {
            if (dist > SLOP_PX * SLOP_PX) cancelPickup();
          } else if (dist > MOUSE_START_PX * MOUSE_START_PX) {
            var p = pickup; pickup = null;
            liftTile(p.tile, p.pointerId, p.x, p.y);
          }
        }
        if (dragState && e.pointerId === dragState.pointerId) {
          dragState.x = e.clientX; dragState.y = e.clientY;
          if (!dragState.raf) dragState.raf = requestAnimationFrame(renderDrag);
          if (!dragState.scrollRaf) dragState.scrollRaf = requestAnimationFrame(autoScroll);
        }
      });
      document.addEventListener('pointerup', function (e) {
        if (pickup && e.pointerId === pickup.pointerId) cancelPickup();
        finishDrag(e);
      });
      document.addEventListener('pointercancel', function (e) {
        if (pickup && e.pointerId === pickup.pointerId) cancelPickup();
        finishDrag(e);
      });
      document.addEventListener('touchmove', function (e) {
        if (!dragState) return;
        e.preventDefault();
      }, { passive: false });
      grid.addEventListener('click', function (e) {
        if (!suppressClick) return;
        e.preventDefault(); e.stopPropagation(); suppressClick = false;
      }, true);
      grid.addEventListener('contextmenu', function (e) {
        if (dragState || (pickup && pickup.pointerType === 'touch')) e.preventDefault();
      });
      grid.addEventListener('dragstart', function (e) {
        // Anchors are natively draggable: a mouse drag would fire the HTML5
        // link-drag and pointercancel our reorder before it starts. Tiles never
        // need native drag, so suppress it outright.
        if (e.target.closest('.card-app')) e.preventDefault();
      });

      function openPanel() {
        panel.classList.add('open');
        document.getElementById('addErr').textContent = '';
        document.getElementById('appName').focus();
        panel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      }
      function closePanel() {
        panel.classList.remove('open');
        panel.reset();
        document.getElementById('addErr').textContent = '';
      }
      document.getElementById('addCancel').addEventListener('click', closePanel);
      panel.addEventListener('submit', function (e) {
        e.preventDefault();
        var name = document.getElementById('appName').value.trim();
        var url = safeUrl(document.getElementById('appUrl').value.trim());
        var icon = safeIconSrc(document.getElementById('appIcon').value.trim());
        var err = document.getElementById('addErr');
        if (!name) { err.textContent = 'Please enter a name.'; return; }
        if (!url) { err.textContent = 'Please enter a valid http(s) URL.'; return; }
        var arr = loadPrivate();
        arr.push({ id: genId(), name: name, url: url, icon: icon || '', kind: 'link' });
        if (!savePrivate(arr)) { err.textContent = 'Could not save (device storage is blocked).'; return; }
        closePanel();
        renderAll();
      });

      // One-tap setup link: open .../#setup=<base64url JSON of [{name,url,sub,icon}]>
      // to import private apps onto THIS device. Confirmed, validated, then the hash is
      // cleared so a refresh won't re-import. Bad/hostile entries are dropped (safeUrl) so
      // a crafted link can't inject anything dangerous — worst case it adds removable tiles.
      function importSeed() {
        var m = /[#&]setup=([^&]+)/.exec(location.hash || '');
        if (!m) return;
        var parsed = null;
        try { parsed = JSON.parse(b64urlDecode(m[1])); } catch (_) { parsed = null; }
        try { history.replaceState(null, '', location.pathname + location.search); } catch (_) {}
        if (!Array.isArray(parsed) || !parsed.length) return;
        var clean = [];
        parsed.forEach(function (a) {
          var u = safeUrl(a && a.url);
          if (!u) return;
          clean.push({ id: genId(), name: String((a && a.name) || 'App').slice(0, 40), url: u,
            sub: String((a && a.sub) || '').slice(0, 60), icon: safeIconSrc(a && a.icon) || '', kind: 'link',
            labelColor: safeColor(a && a.labelColor) || '', borderColor: safeColor(a && a.borderColor) || '',
            glowColor: safeColor(a && a.glowColor) || '' });
        });
        if (!clean.length) return;
        var names = clean.map(function (x) { return x.name; }).join(', ');
        if (!window.confirm('Add ' + clean.length + ' app' + (clean.length > 1 ? 's' : '') + ' to this device?\n\n' + names)) return;
        var existing = loadPrivate();
        var byUrl = {}; existing.forEach(function (x, i) { byUrl[x.url] = i; });
        clean.forEach(function (x) {
          if (byUrl[x.url] !== undefined) {
            // re-tapping a setup link REFRESHES an existing tile, keeps its id. Only
            // overwrite a field the new link actually carries, so a themeless/older
            // re-tap never WIPES an existing tile's name/icon/theme.
            var e = existing[byUrl[x.url]];
            if (x.name) e.name = x.name;
            if (x.sub) e.sub = x.sub;
            if (x.icon) e.icon = x.icon;
            if (x.labelColor) e.labelColor = x.labelColor;
            if (x.borderColor) e.borderColor = x.borderColor;
            if (x.glowColor) e.glowColor = x.glowColor;
          } else {
            byUrl[x.url] = existing.length; existing.push(x);
          }
        });
        savePrivate(existing);
      }

      // Remote tile sync (2026-09-22): the owner's private config service holds the canonical
      // tile list, so a tile's name/icon/link changes on the next open with no setup link to tap.
      // The service URL + read key live only in this device's localStorage (installed once), never
      // in this public page; no key, offline or a bad answer changes nothing. A registry tile is
      // matched by its registry id (rid), or by exact url on first sync, and keeps its device id
      // (so its place in the order survives). Tiles the registry doesn't list are never touched, and
      // a registry tile removed on this device with × stays removed (DKEY).
      var RKEY = 'ericsapps-remote-config-v1';
      var DKEY = 'eric-apps-dismissed-v1';
      var SYNC_FIELDS = ['rid', 'name', 'url', 'sub', 'icon', 'labelColor', 'borderColor', 'glowColor'];
      function remoteSettings() {
        try {
          var v = JSON.parse(localStorage.getItem(RKEY));
          var base = v && safeUrl(v.url);
          if (!base || base.indexOf('https:') !== 0 || typeof v.key !== 'string' || v.key.length < 32) return null;
          return { base: base.charAt(base.length - 1) === '/' ? base : base + '/', key: v.key };
        } catch (_) { return null; }
      }
      function loadDismissed() {
        try { var v = JSON.parse(localStorage.getItem(DKEY)); return Array.isArray(v) ? v : []; }
        catch (_) { return []; }
      }
      function dismissRid(rid) {
        var d = loadDismissed();
        if (d.indexOf(rid) < 0) d.push(rid);
        try { localStorage.setItem(DKEY, JSON.stringify(d.slice(-200))); } catch (_) {}
      }
      function cleanRemoteTile(t) {
        if (!t || typeof t.rid !== 'string' || !/^[a-z0-9-]{1,40}$/.test(t.rid)) return null;
        var u = safeUrl(t.url);
        if (!u) return null;
        return { rid: t.rid, name: String(t.name || 'App').slice(0, 40), url: u, sub: String(t.sub || '').slice(0, 60),
          icon: safeIconSrc(t.icon) || '', labelColor: safeColor(t.labelColor) || '',
          borderColor: safeColor(t.borderColor) || '', glowColor: safeColor(t.glowColor) || '' };
      }
      function mergeRemoteTiles(existing, remote, dismissed) {
        var changed = false;
        remote.forEach(function (r) {
          var hit = null;
          existing.forEach(function (e) { if (!hit && e.rid === r.rid) hit = e; });
          if (!hit) existing.forEach(function (e) { if (!hit && !e.rid && e.url === r.url) hit = e; });
          if (!hit) {
            if (dismissed.indexOf(r.rid) >= 0) return;
            hit = { id: genId(), kind: 'link' };
            existing.push(hit);
            changed = true;
          }
          SYNC_FIELDS.forEach(function (f) { if (hit[f] !== r[f]) { hit[f] = r[f]; changed = true; } });
        });
        return changed;
      }
      var syncing = false;
      function syncRemoteTiles() {
        var s = remoteSettings();
        if (!s || syncing || typeof fetch !== 'function') return;
        syncing = true;
        var ctrl = typeof AbortController === 'function' ? new AbortController() : null;
        var timer = setTimeout(function () { if (ctrl) ctrl.abort(); }, 5000);
        fetch(s.base + 'v1/tiles', { headers: { Authorization: 'Bearer ' + s.key }, cache: 'no-store',
          signal: ctrl ? ctrl.signal : undefined })
          .then(function (res) { return res.ok ? res.json() : null; })
          .then(function (body) {
            if (!body || !Array.isArray(body.tiles)) return;
            var remote = body.tiles.slice(0, 50).map(cleanRemoteTile).filter(Boolean);
            if (!remote.length) return;
            var existing = loadPrivate();
            if (!mergeRemoteTiles(existing, remote, loadDismissed()) || !savePrivate(existing)) return;
            if (!dragState && !pickup) renderAll(); // mid-drag: saved now, drawn on the next render
          })
          .catch(function () {})
          .then(function () { clearTimeout(timer); syncing = false; });
      }
      document.addEventListener('visibilitychange', function () {
        if (document.visibilityState === 'visible') syncRemoteTiles();
      });

      // Load public apps, then render public + private + the add tile.
      (async function () {
        importSeed(); // honor a one-tap setup link before first render
        try {
          var res = await fetch('apps.json?cb=' + Date.now(), { cache: 'no-store' });
          if (!res.ok) throw new Error('HTTP ' + res.status);
          var apps = await res.json();
          publicApps = Array.isArray(apps) ? apps : [];
        } catch (e) {
          // apps.json unreachable: render private tiles only
          publicApps = [];
        }
        renderAll();
        syncRemoteTiles();
      })();
    })();
  </script>
</body>
</html>
