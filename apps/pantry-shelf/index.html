<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#1f3d2e" />
  <meta name="robots" content="noindex" />
  <title>Pantry Shelf</title>
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <header class="masthead">
    <h1>The Pantry Shelf</h1>
  </header>
  <main class="wrap">
    <div id="banner" style="display:none" class="banner">
      Demo shelf. Tap your private <strong>setup link</strong> (emailed to you) to load your own items onto this device.
    </div>
    <div id="shelf"></div>
  </main>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script type="module" src="./app.mjs"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(() => {}));
    }
  </script>
</body>
</html>
