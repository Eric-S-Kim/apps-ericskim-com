<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0B0B0D" />
  <meta name="robots" content="noindex" />
  <title>Class Booker</title>
  <link rel="manifest" href="./manifest.json" />
  <link rel="icon" href="./icon-any-192.png" />
  <link rel="apple-touch-icon" href="./icon-any-192.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./styles.css?v=20260923-tickets2" />
</head>
<body>
  <main class="wrap">
    <header class="top">
      <span class="mark">Class/Booker</span>
      <button id="reset" class="reset" type="button" hidden>Next up</button>
    </header>
    <section id="import" aria-label="Load classes from a setup link" hidden></section>
    <h1 id="title" aria-live="polite" hidden></h1>
    <section id="hero" aria-label="Selected class" hidden></section>
    <section id="week" class="week" aria-label="Week" hidden></section>
    <section id="later" class="later" hidden>
      <h2 id="later-label" class="label"></h2>
      <div id="rows"></div>
    </section>
    <section id="anytime" class="later" hidden>
      <h2 class="label">Any time</h2>
      <div id="anytime-rows"></div>
    </section>
    <section id="empty" class="empty" hidden>
      <strong>Private shortcuts not loaded</strong>
      Open your private Class Booker setup link on this phone to restore them.
    </section>
  </main>
  <script type="module" src="./app.mjs?v=20260923-tickets2"></script>
  <script type="module" src="./delight.mjs?v=20260923-tickets2"></script>
  <script>
    (() => {
      if (!('serviceWorker' in navigator)) return;
      const hadController = Boolean(navigator.serviceWorker.controller);
      let reloaded = false;
      navigator.serviceWorker.addEventListener('controllerchange', () => {
        if (!hadController || reloaded) return;
        reloaded = true;
        location.reload();
      });
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js', { updateViaCache: 'none' }).then((registration) => {
          document.addEventListener('visibilitychange', () => {
            if (document.visibilityState === 'visible') registration.update().catch(() => {});
          });
        }).catch(() => {});
      });
    })();
  </script>
</body>
</html>
